<div class="card m-2 login-container" style="width: 30rem;">
    <div class="card-body">
        <h2 class="card-title text-center login-header">Login</h2>
        <form [formGroup]="customerFormInfo">
            <div class="form-group mb-3">
                <label for="username">Email</label>
                <input type="text" class="form-control" formControlName="username" id="username" name="username"
                    placeholder="Enter your email" required>
                   
            </div>
            <div class="form-group  mb-3">
                <label for="password">Password</label>
                <input type="password" class="form-control" formControlName="password" id="password" name="password"
                    placeholder="Enter your password" required>
              
                </div>
            <h4 class="text-danger card-text">{{loginMessage()}}</h4>
            <button type="button" (click)="onSubmit()" class="btn btn-primary btn-block">Login</button>
        </form>
    </div>
    <div class="mt-3 text-center">
        <a href="#">Forgot Password?</a>
    </div>
    {{resultedData | json}}
</div>
