<div class="row g-4">
     @for (book of bookList; track $index) {
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="card shadow-lg border-0 rounded overflow-hidden position-relative book-card" (click)="displayBook(book.id)">
                
                <!-- Book Image -->
                <img [src]="book.image" [alt]="book.title" class="card-img-top book-image">
                
                <!-- Book Info -->
                <div class="card-body text-center">
                    <h5 class="card-title fw-bold text-dark">{{ book.title }}</h5>
                    <p class="card-text text-muted">{{ book.authorName }}</p>
                    
                    <!-- Price -->
                    <div class="pricing d-flex justify-content-center align-items-center">
                        <h6 class="text-success fw-bold me-2">₹{{ book.sellingPrice }}</h6>
                        <h6 class="text-danger text-decoration-line-through">₹{{ book.actualPrice }}</h6>
                    </div>
                </div>
                
                <!-- Add to Cart Button -->
                <div class="card-footer text-center bg-light">
                    <button class="btn btn-primary fw-bold px-4 shadow-sm" type="button">🛒 Add to Cart</button>
                </div>
            </div>
        </div>
    }
</div>
